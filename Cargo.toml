# Cargo workspace — cross-platform ClaudeUsage.
# See docs/cross-platform.md for the port plan.

[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

# The single source of truth for the app version.
#
# crates/app inherits it via `version.workspace = true`, and Tauri falls back to
# the crate's Cargo.toml version because `version` is omitted from
# tauri.conf.json — so this line alone drives the binary, the bundle and the
# installer filenames. Verified: setting it to 1.1.99 produced
# ClaudeUsage_1.1.99_aarch64.dmg.
[workspace.package]
version    = "1.1.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/alejandrejames/the-usage-monitor"

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
