# project.yml — XcodeGen spec for ClaudeUsage
# Regenerate the .xcodeproj with:  xcodegen generate
#
# This file is build tooling, not an app dependency. The app targets
# themselves use only native Apple frameworks (no SPM / CocoaPods).

name: ClaudeUsage

options:
  bundleIdPrefix: com.you
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""              # set to your Personal Team ID, or leave for automatic
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: "YES"

targets:

  # ── macOS menu-bar app ─────────────────────────────────────────────────────
  ClaudeUsage:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: ClaudeUsage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.claudeusage
        INFOPLIST_KEY_LSUIElement: "YES"          # menu-bar only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: ClaudeUsage/ClaudeUsage.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # ── iOS companion app ──────────────────────────────────────────────────────
  ClaudeUsageIOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: ClaudeUsageIOS
      - path: ClaudeUsage/LoginView.swift            # shared login UI (iOS branch)
    dependencies:
      - target: ClaudeUsageWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.claudeusage.ios
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CODE_SIGN_ENTITLEMENTS: ClaudeUsageIOS/ClaudeUsageIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  # ── WidgetKit extension (iOS) ──────────────────────────────────────────────
  ClaudeUsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ClaudeUsageWidget
      - path: Shared/Theme.swift                     # Theme only — no Auth/UsageStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.claudeusage.widget
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Claude Usage"
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: ClaudeUsageWidget/ClaudeUsageWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
