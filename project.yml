# project.yml — XcodeGen spec for ClaudeUsage (macOS-only)
# Regenerate the .xcodeproj with:  xcodegen generate
#
# This file is build tooling, not an app dependency. The app uses only native
# Apple frameworks (no SPM / CocoaPods).
#
# iOS/widget targets were removed: the only Mac→iPhone sync path (iCloud KVS)
# requires a paid Apple Developer account, which this project (free Personal
# Team) does not have. See README "Known gaps".

name: ClaudeUsage

options:
  bundleIdPrefix: com.you
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"    # Personal Team (free Apple ID: <your-apple-id-email>)
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: "YES"

targets:

  # ── macOS menu-bar app ─────────────────────────────────────────────────────
  ClaudeUsage:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: ClaudeUsage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.claudeusage
        INFOPLIST_KEY_LSUIElement: "YES"          # menu-bar only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_ENTITLEMENTS: ClaudeUsage/ClaudeUsage.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
